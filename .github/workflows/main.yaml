name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site with config
        env:
          DATA_REPO: ${{ vars.DATA_REPO || secrets.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          REPO=$(echo "$DATA_REPO" | sed -E 's#^https?://github.com/##; s#\.git$##; s#/$##')
          mkdir _site
          cp index.html _site/
          printf 'window.CONFIG = { repo: "%s", branch: "main", token: "%s" };\n' "$REPO" "$DATA_TOKEN" > _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
